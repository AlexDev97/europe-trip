<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10221b" />
  <title>欧洲旅行行程｜2026</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: rgba(255,255,255,.86);
      --surface-solid: #ffffff;
      --text: #17211d;
      --muted: #6c746f;
      --line: rgba(23,33,29,.12);
      --accent: #1f6d50;
      --accent-2: #d9895b;
      --shadow: 0 18px 50px rgba(29,48,39,.10);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --sidebar: 290px;
    }
    html[data-theme="dark"] {
      --bg: #101713;
      --surface: rgba(26,36,31,.88);
      --surface-solid: #1a241f;
      --text: #f0f4f1;
      --muted: #a8b2ac;
      --line: rgba(255,255,255,.12);
      --accent: #79d3a9;
      --accent-2: #f2ad7a;
      --shadow: 0 18px 60px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(93,149,116,.16), transparent 30%),
        radial-gradient(circle at 100% 12%, rgba(220,142,94,.14), transparent 28%),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; padding: 26px 20px;
      border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(18px); z-index: 20; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 14px; display:grid; place-items:center; background: var(--text); color: var(--bg); font-size: 21px; box-shadow: var(--shadow); }
    .brand strong { display:block; font-size: 16px; letter-spacing: -.02em; }
    .brand span { font-size: 12px; color: var(--muted); }
    .side-search { position: relative; margin-bottom: 16px; }
    .side-search input { width:100%; height:44px; border-radius: 14px; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:0 14px 0 40px; outline:none; }
    .side-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
    .side-search span { position:absolute; left:14px; top:11px; color:var(--muted); }
    .side-title { margin: 22px 8px 8px; font-size: 11px; text-transform: uppercase; letter-spacing:.14em; color:var(--muted); font-weight:700; }
    .nav-list { display:flex; flex-direction:column; gap:6px; }
    .nav-item { width:100%; border:0; background:transparent; display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:13px; cursor:pointer; text-align:left; transition:.2s ease; }
    .nav-item:hover, .nav-item.active { background: var(--surface); box-shadow: 0 8px 24px rgba(21,44,33,.06); }
    .nav-item .flag { font-size:19px; }
    .nav-item b { font-size:14px; }
    .nav-item small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .side-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }
    .icon-btn { min-height:42px; border:1px solid var(--line); background:var(--surface); border-radius:13px; cursor:pointer; padding:0 12px; transition:.2s; }
    .icon-btn:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
    .side-footer { margin-top:22px; padding:14px; border:1px solid var(--line); border-radius:16px; color:var(--muted); font-size:12px; line-height:1.55; background:var(--surface); }
    .main { min-width:0; padding: 30px clamp(20px, 4vw, 64px) 80px; }
    .mobile-header { display:none; }
    .mobile-tools { display:none; }
    .mobile-tool-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .hero {
      position:relative; overflow:hidden; min-height:360px; border-radius:var(--radius-xl); padding:clamp(28px,5vw,62px);
      background: linear-gradient(135deg, #12382b 0%, #1e5c45 58%, #8e5c3c 130%); color:#fff; box-shadow:var(--shadow);
      display:flex; flex-direction:column; justify-content:flex-end;
    }
    .hero:before { content:""; position:absolute; inset:-60% -10% auto 45%; width:420px; height:420px; border-radius:50%; border:1px solid rgba(255,255,255,.18); box-shadow:0 0 0 60px rgba(255,255,255,.04), 0 0 0 120px rgba(255,255,255,.025); }
    .hero:after { content:"AMS  ·  BRU  ·  MUC  ·  ZRH  ·  PAR"; position:absolute; right:-5px; bottom:22px; font-size:clamp(28px,5vw,72px); font-weight:800; letter-spacing:.08em; color:rgba(255,255,255,.055); white-space:nowrap; }
    .hero-content { position:relative; z-index:2; max-width:820px; }
    .hero h1 { margin:0; font-size:clamp(40px,6vw,78px); line-height:.97; letter-spacing:-.055em; max-width:760px; }
    .hero p { margin:20px 0 0; max-width:620px; color:rgba(255,255,255,.76); font-size:clamp(15px,1.8vw,19px); line-height:1.7; }
    .hero-meta { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
    .hero-meta span { padding:10px 13px; border-radius:999px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(8px); font-size:13px; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
    .primary, .secondary { border:0; border-radius:14px; padding:12px 16px; cursor:pointer; font-weight:700; transition:.2s; }
    .primary { background:#fff; color:#17362b; }
    .secondary { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.18); }
    .primary:hover, .secondary:hover { transform:translateY(-1px); }
    .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin:18px 0 36px; }
    .stat { padding:18px; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-lg); box-shadow:0 10px 30px rgba(20,45,33,.04); }
    .stat b { display:block; font-size:26px; letter-spacing:-.04em; }
    .stat span { color:var(--muted); font-size:12px; }
    .section { margin-top:46px; scroll-margin-top:26px; }
    .section-head { display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; margin-bottom:18px; }
    .country-flag { width:52px; height:52px; display:grid; place-items:center; border-radius:17px; background:var(--surface); border:1px solid var(--line); font-size:27px; box-shadow:0 10px 30px rgba(20,45,33,.06); }
    .section-head h2 { margin:0; font-size:clamp(27px,4vw,46px); letter-spacing:-.04em; }
    .section-head p { margin:6px 0 0; color:var(--muted); line-height:1.6; }
    .hotel-chip { align-self:start; padding:9px 12px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:12px; background:var(--surface); }
    .route-strip { display:flex; gap:8px; overflow:auto; padding:2px 0 13px; scrollbar-width:thin; }
    .route-strip button { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 12px; cursor:pointer; font-size:12px; }
    .day-list { display:flex; flex-direction:column; gap:14px; }
    .day-card { border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-lg); overflow:hidden; box-shadow:0 12px 38px rgba(18,42,31,.045); transition:.25s; }
    .day-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .day-card[hidden] { display:none; }
    .day-toggle { width:100%; border:0; background:transparent; cursor:pointer; padding:20px 22px; display:grid; grid-template-columns:122px minmax(0,1fr) auto; gap:18px; align-items:center; text-align:left; }
    .date-block b { font-size:14px; }
    .date-block small { display:block; margin-top:5px; color:var(--muted); }
    .day-title { min-width:0; }
    .day-title h3 { margin:0; font-size:18px; letter-spacing:-.02em; }
    .day-title p { margin:6px 0 0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chevron { width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; transition:.25s; }
    .day-card.open .chevron { transform:rotate(180deg); background:var(--text); color:var(--bg); }
    .day-content { display:none; padding:0 22px 22px; }
    .day-card.open .day-content { display:block; animation:reveal .22s ease; }
    @keyframes reveal { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
    .timeline { position:relative; margin-top:4px; }
    .timeline:before { content:""; position:absolute; left:119px; top:14px; bottom:14px; width:1px; background:var(--line); }
    .timeline-row { display:grid; grid-template-columns:98px 22px minmax(0,1fr); gap:10px; min-height:44px; align-items:start; padding:7px 0; }
    .time { text-align:right; color:var(--muted); font-size:12px; padding-top:3px; }
    .dot { width:10px; height:10px; border-radius:50%; margin:5px auto 0; background:var(--country-accent, var(--accent)); box-shadow:0 0 0 5px color-mix(in srgb, var(--country-accent, var(--accent)) 14%, transparent); position:relative; z-index:2; }
    .activity { line-height:1.55; font-size:14px; }
    .notes { margin-top:14px; display:grid; gap:8px; }
    .note { padding:12px 14px; border-radius:14px; background:color-mix(in srgb, var(--country-accent, var(--accent)) 8%, var(--surface-solid)); border:1px solid color-mix(in srgb, var(--country-accent, var(--accent)) 18%, var(--line)); font-size:13px; line-height:1.55; }
    .variant { margin-top:12px; padding:16px; border:1px dashed var(--line); border-radius:18px; }
    .variant h4 { margin:0 0 8px; font-size:15px; }
    .bookings { margin-top:52px; border-radius:var(--radius-xl); background:var(--text); color:var(--bg); padding:clamp(24px,4vw,40px); }
    .bookings h2 { margin:0 0 8px; font-size:clamp(26px,3.2vw,42px); letter-spacing:-.04em; }
    .bookings > p { margin:0 0 22px; opacity:.66; }
    .booking-grid { display:grid; gap:10px; }
    .booking-row { display:grid; grid-template-columns:100px minmax(0,1fr) 70px; gap:12px; align-items:center; padding:14px 0; border-top:1px solid rgba(255,255,255,.13); }
    .booking-row .priority { justify-self:end; font-size:11px; padding:5px 9px; border-radius:999px; background:rgba(255,255,255,.12); }
    .empty { display:none; padding:48px 20px; text-align:center; color:var(--muted); }
    .empty.show { display:block; }
    .fab { display:none; position:fixed; right:18px; bottom:18px; z-index:30; width:52px; height:52px; border:0; border-radius:50%; background:var(--text); color:var(--bg); box-shadow:var(--shadow); }
    .highlight { background: #ffef8a; color:#222; padding:0 .12em; border-radius:3px; }
    @media (max-width: 980px) {
      .app { grid-template-columns:1fr; }
      .sidebar { display:none; }
      .mobile-header { display:flex; position:sticky; top:0; z-index:40; justify-content:space-between; align-items:center; padding:12px 16px; background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
      .mobile-header strong { font-size:14px; }
      .main { padding:18px 14px 80px; }
      .mobile-tools { display:block; margin:14px 0 24px; }
      .mobile-tools .side-search { margin-bottom:8px; }
      .hero { min-height:330px; border-radius:24px; }
      .stats { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .section-head { grid-template-columns:auto 1fr; }
      .hotel-chip { grid-column:1/-1; justify-self:start; }
      .day-toggle { grid-template-columns:1fr auto; gap:10px; padding:17px; }
      .date-block { grid-column:1/2; }
      .day-title { grid-column:1/2; }
      .chevron { grid-column:2; grid-row:1/3; }
      .day-content { padding:0 17px 17px; }
      .timeline:before { left:92px; }
      .timeline-row { grid-template-columns:72px 18px minmax(0,1fr); gap:8px; }
      .fab { display:grid; place-items:center; cursor:pointer; }
    }
    @media (max-width: 580px) {
      .hero { padding:26px 22px; min-height:360px; }
      .hero h1 { font-size:42px; }
      .stats { grid-template-columns:1fr 1fr; }
      .stat { padding:14px; }
      .stat b { font-size:22px; }
      .section { margin-top:38px; }
      .section-head h2 { font-size:32px; }
      .country-flag { width:46px; height:46px; border-radius:15px; }
      .timeline:before { left:80px; }
      .timeline-row { grid-template-columns:62px 16px minmax(0,1fr); }
      .time { font-size:11px; }
      .activity { font-size:13px; }
      .booking-row { grid-template-columns:64px 1fr; }
      .booking-row .priority { grid-column:2; justify-self:start; }
    }
    @media print {
      :root { --bg:#fff; --surface:#fff; --text:#111; --muted:#555; --line:#ddd; }
      body { background:#fff; }
      .sidebar, .mobile-header, .fab, .hero-actions, .route-strip { display:none !important; }
      .app { display:block; }
      .main { padding:0; }
      .hero { min-height:auto; border-radius:0; box-shadow:none; background:#173b2e !important; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      .stats { margin:14px 0 24px; }
      .day-card { box-shadow:none; break-inside:avoid; }
      .day-card .day-content { display:block !important; }
      .day-card .chevron { display:none; }
      .bookings { background:#111 !important; color:#fff !important; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    }
  </style>
</head>

        <div class="booking-grid" id="bookingGrid"></div>
      </section>
    </main>
  </div>
  <button class="fab" id="toTop" aria-label="回到顶部">↑</button>

}
function renderNav() {
  $('#sideNav').innerHTML = DATA.countries.map(c=>`<button class="nav-item" data-target="${c.id}"><span class="flag">${c.flag}</span><span><b>${c.name}</b><small>${c.date}</small></span></button>`).join('') + `<button class="nav-item" data-target="bookings"><span class="flag">🎟️</span><span><b>预订清单</b><small>优先确认</small></span></button>`;
}
function timeline(items, accent) {
  return `<div class="timeline" style="--country-accent:${accent}">${items.map(([t,a])=>`<div class="timeline-row"><div class="time">${escapeHTML(t)}</div><div class="dot"></div><div class="activity">${escapeHTML(a)}</div></div>`).join('')}</div>`;
}
function renderDay(day, country, index) {
  const id = `${country.id}-${index}`;
  const variants = day.variants ? day.variants.map(v=>`<div class="variant"><h4>${escapeHTML(v.name)}</h4>${timeline(v.items, country.accent)}</div>`).join('') : '';
  const notes = day.notes?.length ? `<div class="notes">${day.notes.map(n=>`<div class="note">💡 ${escapeHTML(n)}</div>`).join('')}</div>` : '';
  return `<article class="day-card ${index===0?'open':''}" data-search="${escapeHTML([country.name,day.date,day.title,day.stay,day.route,JSON.stringify(day.items||[]),JSON.stringify(day.variants||[]),JSON.stringify(day.notes||[])].join(' ').toLowerCase())}" id="${id}">
    <button class="day-toggle" aria-expanded="${index===0}">
      <div class="date-block"><b>${escapeHTML(day.date)}</b><small>住宿：${escapeHTML(day.stay)}</small></div>
      <div class="day-title"><h3>${escapeHTML(day.title)}</h3><p>${escapeHTML(day.route)}</p></div>
      <div class="chevron">⌄</div>
    </button>
    <div class="day-content">${day.items ? timeline(day.items, country.accent) : ''}${variants}${notes}</div>
  </article>`;
}
function renderContent() {
  $('#content').innerHTML = DATA.countries.map(country=>`<section class="section" id="${country.id}" style="--country-accent:${country.accent}">
    <div class="section-head">
      <div class="country-flag">${country.flag}</div>
      <div><h2>${country.name}</h2><p><strong>${country.date}</strong> · ${escapeHTML(country.summary)}</p></div>
      <div class="hotel-chip">🏨 ${escapeHTML(country.hotel)}</div>
    </div>
    <div class="route-strip">${country.days.map((d,i)=>`<button data-day="${country.id}-${i}">${escapeHTML(d.date.replace(/\s[A-Za-z]+$/,''))}</button>`).join('')}</div>
    <div class="day-list">${country.days.map((d,i)=>renderDay(d,country,i)).join('')}</div>
  </section>`).join('');
}
function renderBookings() {
  $('#bookingGrid').innerHTML = DATA.bookings.map(([date,item,p])=>`<div class="booking-row"><b>${date}</b><span>${escapeHTML(item)}</span><span class="priority">${p}优先</span></div>`).join('');
}
function setOpen(card, open) {
  card.classList.toggle('open', open);
  $('.day-toggle', card).setAttribute('aria-expanded', String(open));
}
function bind() {
  $$('.day-toggle').forEach(btn=>btn.addEventListener('click',()=>setOpen(btn.closest('.day-card'), !btn.closest('.day-card').classList.contains('open'))));
  $$('.route-strip button').forEach(btn=>btn.addEventListener('click',()=>{
    const card = document.getElementById(btn.dataset.day); setOpen(card,true); card.scrollIntoView({behavior:'smooth', block:'center'});
  }));
  $$('.nav-item').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth'})));
  $('#expandAll').addEventListener('click',()=>$$('.day-card:not([hidden])').forEach(c=>setOpen(c,true)));
  $('#collapseAll').addEventListener('click',()=>$$('.day-card').forEach(c=>setOpen(c,false)));
  $('#startBrowse').addEventListener('click',()=>document.getElementById(DATA.countries[0].id).scrollIntoView({behavior:'smooth'}));
  $('#toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  $('#search').addEventListener('input', e=>{ $('#mobileSearch').value=e.target.value; filter(e.target.value); });
  $('#mobileSearch').addEventListener('input', e=>{ $('#search').value=e.target.value; filter(e.target.value); });
  $('#mobileExpand').addEventListener('click',()=>$$('.day-card:not([hidden])').forEach(c=>setOpen(c,true)));
  $('#mobileCollapse').addEventListener('click',()=>$$('.day-card').forEach(c=>setOpen(c,false)));
  $('#themeToggle').addEventListener('click', toggleTheme);
  $('#mobileTheme').addEventListener('click', toggleTheme);
  window.addEventListener('scroll', updateActiveNav, {passive:true});
}
function filter(q) {
  const term = q.trim().toLowerCase(); let visible = 0;
  $$('.day-card').forEach(card=>{
    const match = !term || card.dataset.search.includes(term);
    card.hidden = !match; if(match){ visible++; if(term) setOpen(card,true); }
  });
  $$('.section').forEach(sec=>{ sec.style.display = $$('.day-card:not([hidden])', sec).length ? '' : 'none'; });
  $('#empty').classList.toggle('show', visible===0);
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('trip-theme', next);
  $('#themeToggle').textContent = next==='dark' ? '浅色模式' : '深色模式';
}
function initTheme() {
  const saved = localStorage.getItem('trip-theme');
  if(saved) document.documentElement.dataset.theme = saved;
  $('#themeToggle').textContent = document.documentElement.dataset.theme==='dark' ? '浅色模式' : '深色模式';
}
function updateActiveNav() {
  const candidates = [...DATA.countries.map(c=>document.getElementById(c.id)), document.getElementById('bookings')];
  let active = candidates[0];
  candidates.forEach(el=>{ if(el.getBoundingClientRect().top < 180) active = el; });
  $$('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.target===active.id));
}
function countdown() {
  const start = new Date(DATA.start+'T00:00:00'); const end = new Date(DATA.end+'T23:59:59'); const now = new Date();
  let html;
  if(now < start) { const days=Math.ceil((start-now)/86400000); html=`<b>距离出发还有 ${days} 天</b><br>2026年8月9日开始这趟旅程。`; }
  else if(now <= end) { const day=Math.floor((now-start)/86400000)+1; html=`<b>旅程进行中 · Day ${day}</b><br>今天也记得检查交通与天气。`; }
  else { html=`<b>旅程已完成</b><br>这份页面仍可作为旅行记录浏览。`; }
  $('#countdownBox').innerHTML = html;
}
renderStats(); renderNav(); renderContent(); renderBookings(); initTheme(); bind(); countdown(); updateActiveNav();
</script>
</body>
</html>
